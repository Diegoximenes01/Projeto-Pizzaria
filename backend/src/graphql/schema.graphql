type Usuario {
  id: ID!
  nome: String!
  cpf: String!
  email: String
  telefone: String
  endereco: String!
  enderecos: [String!]
}

type Pizza {
  id: ID!
  nome: String!
  preco: Float!
  ingredientes: [String!]!
  categoria: String!
}

type PedidoItem {
  pizza: Pizza!
  quantidade: Int!
}

type Pedido {
  id: ID!
  itens: [PedidoItem!]!
  total: Float!
  status: String!
  tipoEntrega: String
  taxaEntrega: Float
  tipoPagamento: String
  trocoPara: Float
  usuario: Usuario
}

input PedidoItemInput {
  pizzaId: ID!
  quantidade: Int!
}

type Query {
  pizzas: [Pizza!]!
  pizza(id: ID!): Pizza
  pedidos: [Pedido!]!
  pedido(id: ID!): Pedido
  pedidosUsuario(usuarioId: ID!): [Pedido!]!
  login(cpf: String!, senha: String!): Usuario
  verificarCpf(cpf: String!): Boolean!
}

type Mutation {
  cadastrarUsuario(nome: String!, cpf: String!, email: String!, telefone: String!, senha: String!, endereco: String!): Usuario!
  redefinirSenha(cpf: String!, novaSenha: String!): Usuario!
  atualizarEnderecos(usuarioId: ID!, enderecos: [String!]!): Usuario!
  criarPedido(
    itens: [PedidoItemInput!]!
    usuarioId: ID
    tipoEntrega: String
    taxaEntrega: Float
    tipoPagamento: String
    trocoPara: Float
  ): Pedido!
}
